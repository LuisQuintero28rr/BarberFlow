<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow - Agendar Cita</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; }
        .card { max-width: 450px; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 24px; font-size: 1.8rem; color: #38bdf8; }
        label { font-size: 0.9rem; font-weight: 600; display: block; margin-top: 14px; color: #94a3b8; }
        input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }
        button { background: #0284c7; color: white; font-weight: bold; border: none; margin-top: 24px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .exito { margin-top: 15px; text-align: center; color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>💈 BarberFlow</h1>
    <form id="formCita">
        <label>Nombre del Cliente</label>
        <input type="text" id="nombre" placeholder="Tu nombre completo" required>

        <label>Teléfono WhatsApp</label>
        <input type="text" id="telefono" placeholder="6181234567" required>

        <label>Servicio</label>
        <select id="servicio_id" required></select>

        <label>Barbero / Estilista</label>
        <select id="barbero_id" required></select>

        <label>Fecha y Hora</label>
        <input type="datetime-local" id="fecha_hora" required>

        <button type="submit">Confirmar Cita</button>
    </form>
    <div id="mensaje" class="exito"></div>
</div>

<script>
    async function cargarCatalogos() {
        // Cargar Servicios desde la API
        const resServicios = await fetch('/servicios');
        const servicios = await resServicios.json();
        const selectS = document.getElementById('servicio_id');
        servicios.forEach(s => {
            selectS.innerHTML += `<option value="${s.id}">${s.nombre} - $${s.precio}</option>`;
        });

        // Cargar Barberos desde la API
        const resBarberos = await fetch('/barberos');
        const barberos = await resBarberos.json();
        const selectB = document.getElementById('barbero_id');
        barberos.forEach(b => {
            selectB.innerHTML += `<option value="${b.id}">${b.nombre}</option>`;
        });
    }

    document.getElementById('formCita').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nombre = document.getElementById('nombre').value;
        const telefono = document.getElementById('telefono').value;
        const servicioId = document.getElementById('servicio_id').value;
        const barberoId = document.getElementById('barbero_id').value;
        const fechaHora = document.getElementById('fecha_hora').value.replace('T', ' ');

        const url = `/citas?cliente_nombre=${encodeURIComponent(nombre)}&cliente_telefono=${encodeURIComponent(telefono)}&barbero_id=${barberoId}&servicio_id=${servicioId}&fecha_hora=${encodeURIComponent(fechaHora)}`;
        
        const res = await fetch(url, { method: 'POST' });
        if (res.ok) {
            document.getElementById('mensaje').innerText = '✅ ¡Cita agendada correctamente!';
            document.getElementById('formCita').reset();
            cargarCatalogos();
        }
    });

    cargarCatalogos();
</script>

</body>
</html>
