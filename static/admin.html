<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow - Panel de Administración</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        h1 { color: #38bdf8; margin: 0; }
        h2 { color: #38bdf8; font-size: 1.1rem; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        .card-ingresos { background: #0f172a; border: 1px solid #38bdf8; padding: 15px 25px; border-radius: 10px; text-align: right; }
        .card-ingresos span { display: block; font-size: 0.85rem; color: #94a3b8; font-weight: bold; text-transform: uppercase; }
        .card-ingresos strong { font-size: 1.6rem; color: #4ade80; }

        .forms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card-form { background: #0f172a; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box; }
        .btn-submit { width: 100%; background: #0284c7; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-submit:hover { background: #0369a1; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; }
        tr:hover { background: #334155; }

        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; background: #0284c7; }
        .badge.completada { background: #16a34a; }
        .badge.cancelada { background: #dc2626; }

        .action-btns { display: flex; gap: 6px; }
        .btn-act { border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 0.8rem; }
        .btn-completar { background: #22c55e; }
        .btn-cancelar { background: #f97316; }
        .btn-editar { background: #eab308; }
        .btn-eliminar { background: #ef4444; }

        .item-lista { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px 12px; border-radius: 6px; margin-top: 8px; border: 1px solid #334155; }
        .contenedor-lista { max-height: 140px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <div>
            <h1>💈 BarberFlow - Panel Admin</h1>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
        <div class="card-ingresos">
            <span>Caja / Ingresos Totales</span>
            <strong id="totalIngresos">$0.00</strong>
        </div>
    </div>

    <div class="forms-grid">
        <div class="card-form">
            <h2>➕ Registrar Barbero</h2>
            <form id="formBarbero" onsubmit="registrarBarbero(event)">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="barberoNombre" required placeholder="Ej. Carlos Mendoza">
                </div>
                <div class="form-group">
                    <label>Teléfono WhatsApp</label>
                    <input type="text" id="barberoTelefono" required placeholder="Ej. 6181234567">
                </div>
                <button type="submit" class="btn-submit">Guardar Barbero</button>
            </form>

            <div class="contenedor-lista" id="listaBarberos"></div>
        </div>

        <div class="card-form">
            <h2>✂️ Registrar Servicio</h2>
            <form id="formServicio" onsubmit="registrarServicio(event)">
                <div class="form-group">
                    <label>Nombre del Servicio</label>
                    <input type="text" id="servicioNombre" required placeholder="Ej. Barba + Corte">
                </div>
                <div class="form-group">
                    <label>Precio ($)</label>
                    <input type="number" step="0.01" id="servicioPrecio" required placeholder="Ej. 200">
                </div>
                <div class="form-group">
                    <label>Duración (Minutos)</label>
                    <input type="number" id="servicioDuracion" required placeholder="Ej. 45">
                </div>
                <button type="submit" class="btn-submit">Guardar Servicio</button>
            </form>

            <div class="contenedor-lista" id="listaServicios"></div>
        </div>

        <div class="card-form">
            <h2>🔑 Cambiar Contraseña</h2>
            <form onsubmit="cambiarPassword(event)">
                <div class="form-group">
                    <label>Contraseña Actual</label>
                    <input type="password" id="passActual" required>
                </div>
                <div class="form-group">
                    <label>Nueva Contraseña</label>
                    <input type="password" id="passNueva" required>
                </div>
                <button type="submit" class="btn-submit" style="background:#10b981;">Actualizar Clave</button>
            </form>
        </div>
    </div>

    <h2>📋 Agenda de Citas</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Teléfono</th>
                <th>Barbero</th>
                <th>Servicio</th>
                <th>Fecha y Hora</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaCitas"></tbody>
    </table>
</div>

<script>
    const token = localStorage.getItem('adminToken');

    if (!token) {
        window.location.href = '/login.html';
    }

    function headersAuth() {
        return { 'X-Admin-Token': token };
    }

    function cerrarSesion() {
        localStorage.removeItem('adminToken');
        window.location.href = '/login.html';
    }

    async function fetchProtegido(url, options = {}) {
        options.headers = { ...options.headers, ...headersAuth() };
        const res = await fetch(url, options);
        if (res.status === 401) cerrarSesion();
        return res;
    }

    async function cargarBarberos() {
        const res = await fetch('/barberos');
        if (res.ok) {
            const barberos = await res.json();
            const contenedor = document.getElementById('listaBarberos');
            contenedor.innerHTML = '';
            barberos.forEach(b => {
                contenedor.innerHTML += `
                    <div class="item-lista">
                        <span><strong>${b.nombre}</strong> (${b.telefono})</span>
                        <button class="btn-act btn-eliminar" onclick="eliminarBarbero(${b.id})">🗑️</button>
                    </div>
                `;
            });
        }
    }

    async function eliminarBarbero(id) {
        if (confirm(`¿Estás seguro de eliminar a este barbero?`)) {
            const res = await fetchProtegido(`/barberos/${id}`, { method: 'DELETE' });
            if (res.ok) cargarBarberos();
        }
    }

    async function cargarServicios() {
        const res = await fetch('/servicios');
        if (res.ok) {
            const servicios = await res.json();
            const contenedor = document.getElementById('listaServicios');
            contenedor.innerHTML = '';
            servicios.forEach(s => {
                contenedor.innerHTML += `
                    <div class="item-lista">
                        <span><strong>${s.nombre}</strong> - $${s.precio} (${s.duracion_minutos} min)</span>
                        <div class="action-btns">
                            <button class="btn-act btn-editar" onclick="editarServicio(${s.id}, '${s.nombre}', ${s.precio}, ${s.duracion_minutos})">✏️</button>
                            <button class="btn-act btn-eliminar" onclick="eliminarServicio(${s.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }
    }

    async function editarServicio(id, nombreActual, precioActual, duracionActual) {
        const nuevoNombre = prompt("Nombre del servicio:", nombreActual);
        if (nuevoNombre === null) return;

        const nuevoPrecio = prompt("Precio ($):", precioActual);
        if (nuevoPrecio === null) return;

        const nuevaDuracion = prompt("Duración (minutos):", duracionActual);
        if (nuevaDuracion === null) return;

        const url = `/servicios/${id}?nombre=${encodeURIComponent(nuevoNombre)}&precio=${nuevoPrecio}&duracion_minutos=${nuevaDuracion}`;
        const res = await fetchProtegido(url, { method: 'PUT' });
        if (res.ok) {
            alert('Servicio actualizado correctamente');
            cargarServicios();
        }
    }

    async function eliminarServicio(id) {
        if (confirm(`¿Estás seguro de eliminar este servicio?`)) {
            const res = await fetchProtegido(`/servicios/${id}`, { method: 'DELETE' });
            if (res.ok) cargarServicios();
        }
    }

    async function cargarIngresos() {
        const res = await fetchProtegido('/ingresos');
        if (res.ok) {
            const data = await res.json();
            document.getElementById('totalIngresos').innerText = `$${data.total_ingresos.toFixed(2)}`;
        }
    }

    async function cargarCitas() {
        const res = await fetchProtegido('/citas');
        if (!res.ok) return;

        const citas = await res.json();
        const tabla = document.getElementById('tablaCitas');
        tabla.innerHTML = '';

        citas.forEach(c => {
            const esPendiente = c.estado === 'Pendiente';
            let badgeClass = c.estado === 'Completada' ? 'completada' : (c.estado === 'Cancelada' ? 'cancelada' : '');

            tabla.innerHTML += `
                <tr>
                    <td>${c.id}</td>
                    <td><strong>${c.cliente}</strong></td>
                    <td>${c.telefono}</td>
                    <td>${c.barbero}</td>
                    <td>${c.servicio}</td>
                    <td>${c.fecha_hora}</td>
                    <td><span class="badge ${badgeClass}">${c.estado}</span></td>
                    <td>
                        <div class="action-btns">
                            ${esPendiente ? `<button class="btn-act btn-completar" onclick="cambiarEstado(${c.id}, 'Completada')">✓ Atendido</button>` : ''}
                            ${esPendiente ? `<button class="btn-act btn-cancelar" onclick="cambiarEstado(${c.id}, 'Cancelada')">✕ Cancelar</button>` : ''}
                            <button class="btn-act btn-eliminar" onclick="eliminarCita(${c.id})">🗑️</button>
                        </div>
                    </td>
                </tr>
            `;
        });

        cargarIngresos();
    }

    async function cambiarEstado(id, nuevoEstado) {
        await fetchProtegido(`/citas/${id}?estado=${nuevoEstado}`, { method: 'PUT' });
        cargarCitas();
    }

    async function eliminarCita(id) {
        if (confirm(`¿Estás seguro de eliminar permanentemente la cita ID ${id}?`)) {
            await fetchProtegido(`/citas/${id}`, { method: 'DELETE' });
            cargarCitas();
        }
    }

    async function registrarBarbero(event) {
        event.preventDefault();
        const nombre = document.getElementById('barberoNombre').value;
        const telefono = document.getElementById('barberoTelefono').value;

        const url = `/barberos?nombre=${encodeURIComponent(nombre)}&telefono=${encodeURIComponent(telefono)}`;
        const res = await fetchProtegido(url, { method: 'POST' });
        
        if (res.ok) {
            alert('Barbero registrado con éxito');
            document.getElementById('formBarbero').reset();
            cargarBarberos();
        }
    }

    async function registrarServicio(event) {
        event.preventDefault();
        const nombre = document.getElementById('servicioNombre').value;
        const precio = document.getElementById('servicioPrecio').value;
        const duracion = document.getElementById('servicioDuracion').value;

        const url = `/servicios?nombre=${encodeURIComponent(nombre)}&precio=${precio}&duracion_minutos=${duracion}`;
        const res = await fetchProtegido(url, { method: 'POST' });

        if (res.ok) {
            alert('Servicio registrado con éxito');
            document.getElementById('formServicio').reset();
            cargarServicios();
        }
    }

    async function cambiarPassword(event) {
        event.preventDefault();
        const passActual = document.getElementById('passActual').value;
        const passNueva = document.getElementById('passNueva').value;

        const url = `/cambiar-password?password_actual=${encodeURIComponent(passActual)}&nueva_password=${encodeURIComponent(passNueva)}`;
        const res = await fetchProtegido(url, { method: 'POST' });

        if (res.ok) {
            alert('Contraseña actualizada correctamente.');
            document.getElementById('passActual').value = '';
            document.getElementById('passNueva').value = '';
        } else {
            const data = await res.json();
            alert(data.detail || 'Error al actualizar contraseña');
        }
    }

    cargarBarberos();
    cargarServicios();
    cargarCitas();
</script>

</body>
</html>
